name: Production images

on:
  pull_request:
    paths:
      - "bot/**"
      - "backend/**"
      - "compose*.yaml"
      - ".github/workflows/production.yml"
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "backend/**"
      - "compose*.yaml"
      - ".github/workflows/production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service: [bot, backend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.service }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${SERVICE}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
      - name: Record release image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf '### Release image\n\nImage: `%s:latest`\n\nImmutable reference: `%s@%s`\n' \
            "$IMAGE" "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: images
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request Coolify deployment
        env:
          DEPLOY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          if [[ -z "$DEPLOY_WEBHOOK" && -z "$COOLIFY_TOKEN" ]]; then
            echo "Coolify webhook is unconfigured. Deploy the published images from Coolify."
            exit 0
          fi
          if [[ -z "$DEPLOY_WEBHOOK" || -z "$COOLIFY_TOKEN" ]]; then
            echo "::error::Set both COOLIFY_DEPLOY_WEBHOOK and COOLIFY_API_TOKEN."
            exit 1
          fi
          curl --fail --silent --show-error --request POST \
            --connect-timeout 15 --max-time 60 --output /dev/null \
            --header "Authorization: Bearer $COOLIFY_TOKEN" "$DEPLOY_WEBHOOK"
          echo "Coolify accepted the deployment request. Check Coolify for rollout status." >> "$GITHUB_STEP_SUMMARY"
